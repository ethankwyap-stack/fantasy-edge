<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy Edge</title>
<style>
  :root { --bg:#0f1420; --card:#1a2233; --text:#e8ecf4; --dim:#8a94a8; --accent:#4ade80; --warn:#fbbf24; --bad:#f87171; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.5 -apple-system,system-ui,sans-serif; padding:16px; }
  h1 { font-size:20px; margin-bottom:12px; }
  nav { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  nav button { background:var(--card); color:var(--dim); border:0; padding:8px 16px; border-radius:8px; cursor:pointer; font-size:15px; }
  nav button.on { background:var(--accent); color:#0f1420; font-weight:600; }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:10px; overflow:hidden; }
  th, td { padding:7px 10px; text-align:left; font-size:14px; }
  th { color:var(--dim); font-weight:600; border-bottom:1px solid #2a3450; cursor:default; }
  tr:hover td { background:#222c44; }
  .pos { font-weight:600; }
  .pos-QB{color:#f87171} .pos-RB{color:#4ade80} .pos-WR{color:#60a5fa} .pos-TE{color:#fbbf24} .pos-K{color:#c084fc} .pos-DST{color:#94a3b8}
  .drafted { opacity:.25; text-decoration:line-through; }
  .mine td { background:#1e3a2a !important; }
  .btn { background:#2a3450; color:var(--text); border:0; padding:4px 10px; border-radius:6px; cursor:pointer; font-size:13px; }
  .btn.mine-btn { background:#14532d; }
  .msg { color:var(--dim); padding:20px; }
  .err { color:var(--bad); padding:20px; }
  input[type=search] { background:var(--card); border:1px solid #2a3450; color:var(--text); padding:8px 12px; border-radius:8px; width:240px; margin-bottom:10px; font-size:15px; }
  .badge { background:#2a3450; border-radius:6px; padding:1px 7px; font-size:12px; color:var(--warn); }
  .section { margin-bottom:24px; }
  h2 { font-size:16px; margin:16px 0 8px; color:var(--dim); }
  .trend { color:var(--accent); font-size:12px; }
  select { background:var(--card); color:var(--text); border:1px solid #2a3450; padding:6px 10px; border-radius:8px; font-size:14px; margin-bottom:10px; }
  .tier { background:#2a3450; color:#60a5fa; border-radius:5px; padding:0 5px; font-size:11px; font-weight:700; }
  .chip { background:#242e48; border:1px solid #2a3450; border-radius:6px; padding:0 6px; font-size:11px; color:var(--dim); white-space:nowrap; }
  .chip.good { color:var(--accent); } .chip.risk { color:var(--bad); }
  .tierbreak td { background:#0f1420 !important; color:#60a5fa; font-weight:700; font-size:12px; padding:3px 10px; border-top:2px solid #365a8c; }
  .report td { background:#141b2c !important; color:var(--text); font-size:13px; line-height:1.55; padding:10px 14px; white-space:normal; }
  .report b { color:var(--accent); }
  .rangebar { position:relative; width:90px; height:8px; background:#2a3450; border-radius:4px; }
  .rangebar .fill { position:absolute; height:100%; background:#365a8c; border-radius:4px; }
  .rangebar .mark { position:absolute; top:-2px; width:2px; height:12px; background:var(--accent); }
  .slotbar { background:var(--card); border-radius:10px; padding:10px 12px; margin-bottom:10px; font-size:14px; }
  .slotbar select { margin:0; }
  .onclock { color:var(--accent); }
  .tierbreak .gone { color:#f87171; font-weight:600; }
  .tierbreak .safe { color:#4ade80; font-weight:600; }
</style>
</head>
<body>
<h1>🏈 Fantasy Edge <span id="league" style="color:var(--dim);font-size:14px;font-weight:400"></span></h1>
<nav>
  <button data-tab="draft" class="on">Draft Board</button>
  <button data-tab="lineup">Start/Sit</button>
  <button data-tab="waivers">Waivers</button>
  <button data-tab="trades">Trades</button>
</nav>
<div id="view" class="msg">Loading league data…</div>

<script>
const POS = {1:'QB',2:'RB',3:'WR',4:'TE',5:'K',16:'DST'};
// ponytail: fixed replacement ranks scaled by league size at load; tune if league starts 2 QBs etc.
let REPL = {QB:12, RB:28, WR:32, TE:12, K:12, DST:12};
const S = { tab:'draft', players:[], teams:[], rosters:{}, myTeamId:null, drafted:new Set(JSON.parse(localStorage.d||'[]')), mine:new Set(JSON.parse(localStorage.m||'[]')), trending:{}, search:'', analysis:{}, expanded:new Set() };

// Snake draft: overall pick number of my r-th pick (1-indexed round), given my slot and league size.
const snakePick = (r, slot, size) => r % 2 ? (r-1)*size + slot : r*size - slot + 1;
console.assert(snakePick(1,2,12)===2 && snakePick(2,2,12)===23 && snakePick(3,2,12)===26 && snakePick(1,12,12)===12 && snakePick(2,12,12)===13, 'snakePick broken');

// My next pick given how many players have already come off the board.
function nextPick() {
  const size = S.teams.length, slot = +localStorage.slot;
  if (!size || !slot) return null;
  const made = S.drafted.size, onClock = made + 1;
  for (let r = 1; r <= 20; r++) { const n = snakePick(r, slot, size); if (n >= onClock) return {round:r, pick:n, away:n - onClock}; }
  return null;
}

const $ = s => document.querySelector(s);
const espn = v => fetch('/api/espn?view='+v).then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e.error||r.status)));

function seasonProj(p) {
  // statSourceId 1 = projected, scoringPeriodId 0 = full season
  const s = (p.stats||[]).find(s => s.statSourceId===1 && s.scoringPeriodId===0 && s.seasonId===2026);
  return s ? Math.round(s.appliedTotal) : 0;
}
function weekProj(p, week) {
  const s = (p.stats||[]).find(s => s.statSourceId===1 && s.scoringPeriodId===week && s.seasonId===2026);
  return s ? +s.appliedTotal.toFixed(1) : 0;
}

async function sleeperNames() {
  // ponytail: the full Sleeper dump is ~5MB; cache just id→name for 24h
  try { const c = JSON.parse(localStorage.sn); if (Date.now() - c.t < 864e5) return c.d; } catch {}
  const all = await fetch('https://api.sleeper.app/v1/players/nfl').then(r=>r.json()).catch(()=>({}));
  const d = {}; for (const id in all) if (all[id].full_name) d[id] = all[id].full_name;
  try { localStorage.sn = JSON.stringify({t: Date.now(), d}); } catch {}
  return d;
}

async function load() {
  try {
    const filter = encodeURIComponent(JSON.stringify({players:{limit:400, sortDraftRanks:{sortPriority:1, sortAsc:true, value:'PPR'}}}));
    const [league, playerData, trending, analysis] = await Promise.all([
      espn('mTeam,mRoster,mSettings'),
      fetch('/api/espn?view=kona_player_info&filter='+filter).then(r=>r.json()),
      fetch('https://api.sleeper.app/v1/players/nfl/trending/add?limit=50').then(r=>r.json()).catch(()=>[]),
      fetch('/draft-analysis.json').then(r=>r.json()).catch(()=>({}))
    ]);
    S.analysis = analysis.players || {};
    S.week = league.scoringPeriodId || 1;
    S.teams = league.teams || [];
    const size = S.teams.length || 10;
    REPL = {QB:Math.round(1.2*size), RB:Math.round(2.8*size), WR:Math.round(3.2*size), TE:Math.round(1.2*size), K:size, DST:size};
    $('#league').textContent = (league.settings?.name||'') + ' · Week ' + S.week;
    for (const t of S.teams) S.rosters[t.id] = (t.roster?.entries||[]).map(e => e.playerPoolEntry?.player).filter(Boolean);
    // guess my team via SWID match on owners; fall back to picker
    S.myTeamId = +localStorage.myTeam || S.teams[0]?.id;
    S.players = (playerData.players||[]).map(x => x.player).filter(p => POS[p.defaultPositionId]);
    // VBD: projection minus replacement-level projection at position
    const byPos = {};
    for (const p of S.players) (byPos[POS[p.defaultPositionId]] ||= []).push(p);
    for (const pos in byPos) {
      byPos[pos].sort((a,b) => seasonProj(b)-seasonProj(a));
      const repl = seasonProj(byPos[pos][Math.min(REPL[pos], byPos[pos].length-1)] || {});
      for (const p of byPos[pos]) p._vbd = seasonProj(p) - repl;
    }
    S.players.sort((a,b) => b._vbd - a._vbd);
    // Sleeper trending — match by name
    if (trending.length) {
      const names = await sleeperNames();
      for (const t of trending) { const n = names[t.player_id]; if (n) S.trending[n.toLowerCase()] = t.count; }
    }
    render();
  } catch (e) { $('#view').innerHTML = '<div class="err">Error: '+e+'<br><br>Check .env has LEAGUE_ID, ESPN_S2, SWID — see README.</div>'; }
}

function toggle(set, key, id) { set.has(id) ? set.delete(id) : set.add(id); localStorage[key] = JSON.stringify([...set]); render(); }
window.tDraft = id => toggle(S.drafted, 'd', id);
window.tMine = id => { if (!S.mine.has(id)) S.drafted.add(id); toggle(S.mine, 'm', id); localStorage.d = JSON.stringify([...S.drafted]); };
window.setTeam = id => { S.myTeamId = +id; localStorage.myTeam = id; render(); };

function row(p, extra='') {
  const pos = POS[p.defaultPositionId];
  const tr = S.trending[(p.fullName||'').toLowerCase()];
  return `<tr class="${S.drafted.has(p.id)?'drafted':''} ${S.mine.has(p.id)?'mine':''}">
    <td>${p.fullName} ${tr?'<span class="trend">🔥'+tr+'</span>':''}</td>
    <td class="pos pos-${pos}">${pos}</td>
    <td>${seasonProj(p)}</td><td>${p._vbd>0?'+':''}${Math.round(p._vbd)}</td>${extra}</tr>`;
}

const A = name => S.analysis[(name||'').toLowerCase()];
const GOOD = new Set(['breakout','workhorse','elite','easy-playoffs','handcuff']);
const RISK = new Set(['split-touches','depth-risk','injury-history','decline-risk','tough-playoffs','td-dependent']);
window.tExp = id => { S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id); renderBody(); };

function rangeBar(a) {
  if (!a || a.ceiling == null) return '';
  const max = S.maxCeil || 1;
  const l = Math.max(0, a.floor/max*100), r = Math.min(100, a.ceiling/max*100);
  const m = Math.min(100, (a.proj || (a.floor+a.ceiling)/2)/max*100);
  return `<div class="rangebar" title="floor ${Math.round(a.floor)} · proj ${a.proj??'?'} · ceiling ${Math.round(a.ceiling)}">
    <div class="fill" style="left:${l}%;width:${Math.max(2,r-l)}%"></div><div class="mark" style="left:${m}%"></div></div>`;
}
function drow(p) {
  const a = A(p.fullName), pos = POS[p.defaultPositionId];
  const tr = S.trending[(p.fullName||'').toLowerCase()];
  const chips = (a?.badges||[]).map(b=>`<span class="chip ${GOOD.has(b)?'good':RISK.has(b)?'risk':''}">${b}</span>`).join(' ');
  let out = `<tr class="${S.drafted.has(p.id)?'drafted':''} ${S.mine.has(p.id)?'mine':''}"${a?` onclick="tExp(${p.id})" style="cursor:pointer"`:''}>
    <td>${a?`<span class="tier">T${a.tier}</span> `:''}${p.fullName} ${tr?'<span class="trend">🔥'+tr+'</span>':''} ${chips}</td>
    <td class="pos pos-${pos}">${pos}</td>
    <td>${seasonProj(p)}</td><td>${p._vbd>0?'+':''}${Math.round(p._vbd)}</td>
    <td>${rangeBar(a)}</td>
    <td><button class="btn" onclick="event.stopPropagation();tDraft(${p.id})">✕</button> <button class="btn mine-btn" onclick="event.stopPropagation();tMine(${p.id})">★</button></td></tr>`;
  if (a && S.expanded.has(p.id)) out += `<tr class="report"><td colspan="6"><b>${a.verdict||''}</b><br>${a.report||''}<br><span style="color:var(--dim)">Range: ${Math.round(a.floor)} floor · ${a.proj??'?'} proj · ${Math.round(a.ceiling)} ceiling PPR pts</span></td></tr>`;
  return out;
}
function draftRows() {
  const list = S.players.filter(p => !S.search || p.fullName.toLowerCase().includes(S.search)).slice(0,300);
  S.maxCeil = Math.max(1, ...list.map(p => A(p.fullName)?.ceiling || 0));
  // ponytail: overall list mixes position tiers — break rows fire when the running max tier deepens
  const left = {};
  for (const p of list) { const a = A(p.fullName); if (a && !S.drafted.has(p.id)) left[a.tier] = (left[a.tier]||0) + 1; }
  const np = nextPick();
  let maxTier = 0, out = '';
  for (const p of list) {
    const a = A(p.fullName);
    if (a && a.tier > maxTier) {
      maxTier = a.tier;
      const n = left[maxTier] || 0;
      const gone = np && n <= np.away;
      out += `<tr class="tierbreak"><td colspan="6">Tier ${maxTier} · ${n} left${np ? (gone ? ` <span class="gone">likely gone by your #${np.pick}</span>` : ` <span class="safe">should survive to #${np.pick}</span>`) : ''}</td></tr>`;
    }
    out += drow(p);
  }
  return out;
}

const views = {
  draft() {
    return slotBar() + `<input type="search" placeholder="Search player…" value="${S.search}" oninput="S.search=this.value.toLowerCase();renderBody()">
    <div style="color:var(--dim);font-size:13px;margin-bottom:8px">Tap ✕ when anyone drafts a player, ★ when YOU draft them. ${Object.keys(S.analysis).length?'Tap a row for the full research report. ':''}Sorted by value over replacement (PPR). <button class="btn" onclick="if(confirm('Reset draft board?')){S.drafted.clear();S.mine.clear();localStorage.d='[]';localStorage.m='[]';render()}">Reset</button></div>
    <table><tr><th>Player</th><th>Pos</th><th>Proj</th><th>VBD</th><th>Floor–Ceiling</th><th></th></tr><tbody id="tbody">${draftRows()}</tbody></table>`;
  },
  lineup() {
    const roster = S.rosters[S.myTeamId] || [];
    const rows = roster.map(p => ({p, w: weekProj(p, S.week)})).sort((a,b) => b.w - a.w);
    if (!rows.length) return teamPicker() + '<div class="msg">No roster yet — this tab comes alive after your draft.</div>';
    return teamPicker() + `<h2>Week ${S.week} — sorted by ESPN projection. Start from the top of each position.</h2>
    <table><tr><th>Player</th><th>Pos</th><th>Wk ${S.week} Proj</th><th>Injury</th></tr>${
      rows.map(({p,w}) => `<tr><td>${p.fullName}</td><td class="pos pos-${POS[p.defaultPositionId]}">${POS[p.defaultPositionId]}</td><td>${w}</td><td>${p.injuryStatus && p.injuryStatus!=='ACTIVE' ? '<span class="badge">'+p.injuryStatus+'</span>':''}</td></tr>`).join('')
    }</table>`;
  },
  waivers() {
    const rostered = new Set(Object.values(S.rosters).flat().map(p => p.id));
    const fa = S.players.filter(p => !rostered.has(p.id));
    const hot = fa.filter(p => S.trending[(p.fullName||'').toLowerCase()]);
    return `${hot.length?'<h2>🔥 Trending pickups (Sleeper add-counts, last 24h) still free in YOUR league</h2><table><tr><th>Player</th><th>Pos</th><th>Proj</th><th>VBD</th></tr>'+hot.map(p=>row(p)).join('')+'</table>':''}
    <h2>Best available by rest-of-season value</h2>
    <table><tr><th>Player</th><th>Pos</th><th>Proj</th><th>VBD</th></tr>${fa.slice(0,40).map(p=>row(p)).join('')}</table>`;
  },
  trades() {
    const need = t => { // surplus/deficit of VBD by position vs league median
      const by = {}; for (const p of S.rosters[t.id]||[]) { const pl = S.players.find(x=>x.id===p.id); (by[POS[p.defaultPositionId]] ||= []).push(pl?pl._vbd:0); }
      return by;
    };
    const mine = need({id:S.myTeamId});
    const sum = a => (a||[]).filter(v=>v>0).reduce((x,y)=>x+y,0);
    let out = teamPicker() + '<h2>Where each team is strong (total positive VBD by position) — trade your surplus into their gap</h2><table><tr><th>Team</th><th>QB</th><th>RB</th><th>WR</th><th>TE</th><th>Idea</th></tr>';
    for (const t of S.teams) {
      const n = need(t);
      const P = ['RB','WR','TE'];
      const idea = t.id===S.myTeamId ? '(you)' : P.flatMap(pos => P.filter(o => o!==pos).map(other =>
        sum(mine[pos]) > sum(n[pos])*1.5 && sum(n[other]) > sum(mine[other])*1.5 ? `Your ${pos} for their ${other}` : null
      )).filter(Boolean).join('; ') || '—';
      out += `<tr class="${t.id===S.myTeamId?'mine':''}"><td>${t.name||t.location+' '+t.nickname}</td><td>${Math.round(sum(n.QB))}</td><td>${Math.round(sum(n.RB))}</td><td>${Math.round(sum(n.WR))}</td><td>${Math.round(sum(n.TE))}</td><td>${idea}</td></tr>`;
    }
    return out + '</table>';
  }
};
window.setSlot = v => { localStorage.slot = v; render(); };
function slotBar() {
  const size = S.teams.length, slot = +localStorage.slot, np = nextPick();
  const opts = Array.from({length:size}, (_,i) => `<option value="${i+1}" ${i+1===slot?'selected':''}>${i+1}</option>`).join('');
  const status = np
    ? (np.away === 0 ? `<b class="onclock">YOU'RE ON THE CLOCK — pick #${np.pick} (round ${np.round})</b>`
       : `Next up: <b>#${np.pick}</b> (round ${np.round}) · <b>${np.away}</b> pick${np.away===1?'':'s'} away · ${S.drafted.size} off the board`)
    : 'Set your draft slot to see when you pick next.';
  return `<div class="slotbar">Draft slot <select onchange="setSlot(this.value)"><option value="">—</option>${opts}</select>
    <span style="color:var(--dim)">of ${size}</span> &nbsp; ${status}</div>`;
}
function teamPicker() {
  return `<select onchange="setTeam(this.value)">${S.teams.map(t=>`<option value="${t.id}" ${t.id===S.myTeamId?'selected':''}>${t.name||t.location+' '+t.nickname}</option>`).join('')}</select> <span style="color:var(--dim);font-size:13px">← pick YOUR team</span><br>`;
}
function render() { $('#view').className=''; $('#view').innerHTML = views[S.tab](); }
function renderBody() { if (S.tab==='draft') $('#tbody').innerHTML = draftRows(); }
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); S.tab=b.dataset.tab; render(); });
load();
// ponytail: full reload every 5 min keeps data live; websockets overkill for daily-changing data
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
