<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy Edge</title>
<style>
  :root { --bg:#0f1420; --card:#1a2233; --text:#e8ecf4; --dim:#8a94a8; --accent:#4ade80; --warn:#fbbf24; --bad:#f87171; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.5 -apple-system,system-ui,sans-serif; padding:16px; }
  h1 { font-size:20px; margin-bottom:12px; }
  nav { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  nav button { background:var(--card); color:var(--dim); border:0; padding:8px 16px; border-radius:8px; cursor:pointer; font-size:15px; }
  nav button.on { background:var(--accent); color:#0f1420; font-weight:600; }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:10px; overflow:hidden; }
  .tbl-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:10px; }
  .tbl-wrap table { min-width:560px; }
  th, td { padding:7px 10px; text-align:left; font-size:14px; }
  th { color:var(--dim); font-weight:600; border-bottom:1px solid #2a3450; cursor:default; }
  tr:hover td { background:#222c44; }
  .pos { font-weight:600; }
  .pos-QB{color:#f87171} .pos-RB{color:#4ade80} .pos-WR{color:#60a5fa} .pos-TE{color:#fbbf24} .pos-K{color:#c084fc} .pos-DST{color:#94a3b8}
  .drafted { opacity:.25; text-decoration:line-through; }
  .mine td { background:#1e3a2a !important; }
  .btn { background:#2a3450; color:var(--text); border:0; padding:4px 10px; border-radius:6px; cursor:pointer; font-size:13px; }
  .btn.mine-btn { background:#14532d; }
  .msg { color:var(--dim); padding:20px; }
  .err { color:var(--bad); padding:20px; }
  input[type=search] { background:var(--card); border:1px solid #2a3450; color:var(--text); padding:8px 12px; border-radius:8px; width:240px; margin-bottom:10px; font-size:15px; }
  .badge { background:#2a3450; border-radius:6px; padding:1px 7px; font-size:12px; color:var(--warn); }
  .section { margin-bottom:24px; }
  h2 { font-size:16px; margin:16px 0 8px; color:var(--dim); }
  .trend { color:var(--accent); font-size:12px; }
  select { background:var(--card); color:var(--text); border:1px solid #2a3450; padding:6px 10px; border-radius:8px; font-size:14px; margin-bottom:10px; }
  .tier { background:#2a3450; color:#60a5fa; border-radius:5px; padding:0 5px; font-size:11px; font-weight:700; }
  .chip { background:#242e48; border:1px solid #2a3450; border-radius:6px; padding:0 6px; font-size:11px; color:var(--dim); white-space:nowrap; }
  .chip.good { color:var(--accent); } .chip.risk { color:var(--bad); }
  .tierbreak td { background:#0f1420 !important; color:#60a5fa; font-weight:700; font-size:12px; padding:3px 10px; border-top:2px solid #365a8c; }
  .report td { background:#141b2c !important; color:var(--text); font-size:13px; line-height:1.55; padding:10px 14px; white-space:normal; }
  .report b { color:var(--accent); }
  .rangebar { position:relative; width:90px; height:8px; background:#2a3450; border-radius:4px; }
  .rangebar .fill { position:absolute; height:100%; background:#365a8c; border-radius:4px; }
  .rangebar .mark { position:absolute; top:-2px; width:2px; height:12px; background:var(--accent); }
  .slotbar { background:var(--card); border-radius:10px; padding:10px 12px; margin-bottom:10px; font-size:14px; }
  .slotbar select { margin:0; }
  .onclock { color:var(--accent); }
  .tierbreak .gone { color:#f87171; font-weight:600; }
  .tierbreak .safe { color:#4ade80; font-weight:600; }
  .fbar { background:var(--card); border-radius:10px; padding:8px 10px; margin-bottom:10px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .fchip { background:#242e48; border:1px solid #2a3450; border-radius:6px; padding:3px 9px; font-size:13px; color:var(--dim); cursor:pointer; user-select:none; }
  .fchip.on { background:var(--accent); color:#0f1420; border-color:var(--accent); font-weight:600; }
  .fchip.only { background:#14532d; color:var(--accent); border-color:#166534; }
  .fchip.hide { background:#3b1d1d; color:var(--bad); border-color:#7f1d1d; text-decoration:line-through; }
  .fsep { width:1px; height:18px; background:#2a3450; margin:0 4px; }
  .flabel { color:var(--dim); font-size:12px; }
  .brow { flex-basis:100%; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .dtag { display:inline-block; color:var(--bad); font-size:11px; text-decoration:none; }
  .meta { color:var(--dim); font-size:11px; white-space:nowrap; }
  .inj { border-radius:5px; padding:0 5px; font-size:11px; font-weight:700; }
  .inj.out { background:#3b1d1d; color:#f87171; } .inj.qst { background:#3b2f14; color:var(--warn); }
  .news { color:#93b4e8; font-size:12px; display:block; margin-top:6px; text-decoration:none; }
  .news:hover { text-decoration:underline; }
  .newsdate { color:var(--dim); }
</style>
</head>
<body>
<h1>🏈 Fantasy Edge <span id="league" style="color:var(--dim);font-size:14px;font-weight:400"></span></h1>
<nav>
  <button data-tab="draft" class="on">Draft Board</button>
  <button data-tab="lineup">Start/Sit</button>
  <button data-tab="waivers">Waivers</button>
  <button data-tab="trades">Trades</button>
</nav>
<div id="view" class="msg">Loading league data…</div>

<script>
const POS = {1:'QB',2:'RB',3:'WR',4:'TE',5:'K',16:'DST'};
// ponytail: fixed replacement ranks scaled by league size at load; tune if league starts 2 QBs etc.
let REPL = {QB:12, RB:28, WR:32, TE:12, K:12, DST:12};
const S = { tab:'draft', players:[], teams:[], rosters:{}, myTeamId:null, drafted:new Set(JSON.parse(localStorage.d||'[]')), mine:new Set(JSON.parse(localStorage.m||'[]')), sleepers:new Set(JSON.parse(localStorage.sl||'[]')), tradeRejects:new Set(JSON.parse(localStorage.tr||'[]')), trending:{}, search:'', analysis:{}, ranks:{}, boom:{}, expanded:new Set(), meta:{}, injuries:{}, news:{}, bmUnmatched:[],
  // ponytail: filters are in-memory only — they reset on refresh, no localStorage key to go stale mid-draft
  pos:'', sort:'vbd', hideDrafted:true, badge:{} };

// Snake draft: overall pick number of my r-th pick (1-indexed round), given my slot and league size.
const snakePick = (r, slot, size) => r % 2 ? (r-1)*size + slot : r*size - slot + 1;
console.assert(snakePick(1,2,12)===2 && snakePick(2,2,12)===23 && snakePick(3,2,12)===26 && snakePick(1,12,12)===12 && snakePick(2,12,12)===13, 'snakePick broken');

// Rounds he traded away — he does not pick in these, so never point him at them.
// 2026: sold the 7th for $248 FAAB + the other manager's 10th (that acquired pick
// sits at THEIR slot, which we don't know, so it isn't modelled — just noted in the bar).
// Also swapped his 5th (pick 50) for the other manager's 4th (pick 44) — round 5 is gone,
// and pick 44 replaces it (not modelled as a slot since it's a fixed overall number, not
// his snake slot — just noted in the bar like the 10th above).
// Also traded away his 2nd (pick 23) for the other manager's 2nd (pick 17) — round 2 is
// gone too; pick 17 replaces it, same "fixed overall number, not his slot" situation.
const TRADED_ROUNDS = new Set([2, 5, 7]);

// My next pick given how many players have already come off the board.
function nextPick() {
  const size = S.teams.length, slot = +localStorage.slot;
  if (!size || !slot) return null;
  const made = S.drafted.size, onClock = made + 1;
  for (let r = 1; r <= 20; r++) {
    if (TRADED_ROUNDS.has(r)) continue;
    const n = snakePick(r, slot, size); if (n >= onClock) return {round:r, pick:n, away:n - onClock};
  }
  return null;
}
console.assert(!TRADED_ROUNDS.size || nextPick.toString().includes('TRADED_ROUNDS'), 'traded-round skip removed');

const $ = s => document.querySelector(s);
const espn = v => fetch('/api/espn?view='+v).then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e.error||r.status)));

function seasonProj(p) {
  // statSourceId 1 = projected, scoringPeriodId 0 = full season
  const s = (p.stats||[]).find(s => s.statSourceId===1 && s.scoringPeriodId===0 && s.seasonId===2026);
  return s ? Math.round(s.appliedTotal) : 0;
}
// ESPN is one opinion, not the truth. Every source that ranks a player gets an equal vote:
// ESPN's projection, the market's ADP, and each analyst board in analyst-ranks.json. A player's
// consensus positional rank is the mean of the votes he actually HAS — a board that omits him
// casts no vote, because Holka's list stops at 150 and Smyth only covers QB/TE, so absence from
// either means "not rated", never "rated badly".
// ponytail: equal weights. Give an analyst more pull by raising his number here.
const WEIGHTS = { espn: 1, adp: 1, analyst: 1 };
// Ethan trusts Smyth as a TIEBREAKER, not an override: when the sources already sit close
// together his read decides where inside that cluster the player lands. When they disagree
// badly, a boost would just let one man overrule everyone, so it does not apply — and the
// result can never leave the range the sources already span either way.
const FAVOR = { Smyth: 3 }, CLOSE = 5;
// Consensus rank is fractional (RB7.5), but VBD needs POINTS. Read the points off ESPN's own
// projection curve for the position at that rank: the curve's shape is ESPN's, the ORDER is the
// consensus. Interpolating keeps a half-rank difference from rounding away to nothing.
function valueAt(curve, r) {
  const lo = Math.floor(r), hi = Math.ceil(r), last = curve.length - 1;
  const at = i => curve[Math.max(0, Math.min(last, i - 1))] || 0;
  return at(lo) + (at(hi) - at(lo)) * (r - lo);
}
function consensus(list, pos) {
  const curve = list.map(seasonProj).sort((a, b) => b - a);
  const espnRank = new Map(), adpRank = new Map();
  [...list].sort((a, b) => seasonProj(b) - seasonProj(a)).forEach((p, i) => espnRank.set(p, i + 1));
  const adp = p => p.ownership?.averageDraftPosition || 0;
  [...list].filter(adp).sort((a, b) => adp(a) - adp(b)).forEach((p, i) => adpRank.set(p, i + 1));
  for (const p of list) {
    // A 0 projection is ESPN saying "not playing" (IR, suspended, off a roster), not "ranked low".
    // Analyst boards go stale the moment a player lands on IR, so letting a July rank outvote that
    // floats an unavailable player into the draftable rounds. ESPN alone decides these.
    // _market = what a normal ESPN manager sees: the projection tab and ADP, nothing else. It is
    // the OTHER side's valuation in the trade engine — no analyst boards, no boom rate.
    p._market = adpRank.has(p) ? (espnRank.get(p) + adpRank.get(p)) / 2 : espnRank.get(p);
    if (!seasonProj(p)) { p._votes = null; p._consensus = espnRank.get(p); p._espnRank = espnRank.get(p); p._market = espnRank.get(p); continue; }
    const votes = [{ src: 'ESPN', rank: espnRank.get(p), w: WEIGHTS.espn }];
    if (adpRank.has(p)) votes.push({ src: 'ADP', rank: adpRank.get(p), w: WEIGHTS.adp });
    for (const a of S.ranks[(p.fullName || '').toLowerCase()] || [])
      if (a.pos === pos) votes.push({ src: a.analyst, rank: a.rank, w: WEIGHTS.analyst, note: a.note });
    const ranks = votes.map(v => v.rank);
    const close = Math.max(...ranks) - Math.min(...ranks) <= CLOSE;
    if (close) for (const v of votes) if (FAVOR[v.src]) { v.w *= FAVOR[v.src]; v.favored = true; }
    const w = votes.reduce((t, v) => t + v.w, 0);
    p._votes = votes;
    p._consensus = votes.reduce((t, v) => t + v.rank * v.w, 0) / w;
    p._espnRank = espnRank.get(p);
  }
  list.sort((a, b) => a._consensus - b._consensus);
  const repl = valueAt(curve, Math.min(REPL[pos], list.length));
  // _cval = the consensus rank read back as POINTS. VBD is that minus replacement; the trade
  // engine needs the raw points instead, because starter value compares players to each other.
  list.forEach((p, i) => { p._posRank = i + 1; p._cval = valueAt(curve, p._consensus); p._mval = valueAt(curve, p._market); p._vbd = p._cval - repl; });
}
// A player only ESPN rates keeps ESPN's rank; two analysts who both rate him higher must pull him up.
(() => {
  const mk = n => Array.from({length: n}, (_, i) => ({ fullName: 'P' + i, ownership: {},
    stats: [{ statSourceId: 1, scoringPeriodId: 0, seasonId: 2026, appliedTotal: 300 - i * 10 }] }));
  const saved = S.ranks;
  S.ranks = { p4: [{ analyst: 'A', pos: 'RB', rank: 1 }, { analyst: 'B', pos: 'RB', rank: 1 }] };
  const l = mk(6); consensus(l, 'RB');
  console.assert(l[0].fullName === 'P0' && l.find(p => p.fullName === 'p4' || p.fullName === 'P4')._posRank < 5, 'consensus: analysts did not pull the player up');
  // Smyth breaks a CLOSE vote (weight 3), but a far-apart vote falls back to equal weights.
  // No ADP in these fixtures, so each player has exactly two votes: ESPN's rank and Smyth's.
  const smythOn = (who, rank) => { const l = mk(12);
    S.ranks = { [who.toLowerCase()]: [{ analyst: 'Smyth', pos: 'RB', rank }] };
    consensus(l, 'RB'); return l.find(x => x.fullName === who)._consensus; };
  // P5 is ESPN's RB6. Smyth says RB4 — 2 apart, so close: (6*1 + 4*3)/4 = 4.5, not the 5.0 of equal weights.
  console.assert(Math.abs(smythOn('P5', 4) - 4.5) < 0.01, 'FAVOR: close vote did not lean to Smyth');
  // P11 is ESPN's RB12. Smyth says RB1 — 11 apart, far too wide to be a tiebreak: (12 + 1)/2 = 6.5.
  console.assert(Math.abs(smythOn('P11', 1) - 6.5) < 0.01, 'FAVOR: far vote must stay at equal weights');
  // A 0-projection player (IR) must NOT be rescued by an analyst's stale top rank.
  const ir = mk(6); ir[5].stats[0].appliedTotal = 0;
  S.ranks = { p5: [{ analyst: 'A', pos: 'RB', rank: 1 }] };
  consensus(ir, 'RB');
  console.assert(ir[ir.length-1].fullName === 'P5', 'consensus: analyst rescued an IR player');
  S.ranks = {};
  const l2 = mk(6); consensus(l2, 'RB');
  console.assert(l2.map(p => p.fullName).join() === 'P0,P1,P2,P3,P4,P5', 'consensus: ESPN-only order changed');
  S.ranks = saved;
})();

// Tiers are MEASURED, not judged. Within a position (already sorted by projection desc), a new
// tier starts where the drop to the next player is a cliff RELATIVE TO ITS NEIGHBOURS — compared
// against the median gap in a window around it, not the whole position. A position's global median
// is dragged near zero by its long flat tail, which made every gap at the top look like a cliff.
// MIN_CLIFF then stops 2-pt "cliffs" firing down in that tail where everything is bunched.
// ponytail: rolling median, no clustering lib. Raise CLIFF/MIN_CLIFF if breaks get noisy.
const CLIFF = 2.5, MIN_CLIFF = 8, WIN = 6;
let tierLeft = {};
const median = a => a.length ? [...a].sort((x, y) => x - y)[a.length >> 1] : 0;
function tierize(sorted) {
  const gaps = sorted.slice(1).map((p, i) => sorted[i]._vbd - p._vbd);
  let t = 1;
  sorted.forEach((p, i) => {
    const g = gaps[i-1];
    const local = median(gaps.slice(Math.max(0, i-1-WIN), i-1+WIN));
    p._cliff = i && g >= MIN_CLIFF && g >= local * CLIFF ? Math.round(g) : 0;
    if (p._cliff) t++;
    p._tier = t;
  });
}
// One big cliff among small gaps must split the tier; an even slope must not; a bunched tail must not.
(() => {
  const mk = v => v.map(x => ({ _vbd: x }));
  const cliffy = mk([100,97,94,60,57,54]); tierize(cliffy);
  console.assert(cliffy.map(p=>p._tier).join()==='1,1,1,2,2,2', 'tierize: missed the cliff');
  const even = mk([100,90,80,70,60,50]); tierize(even);
  console.assert(even.every(p=>p._tier===1), 'tierize: split an even slope');
  const tail = mk([10,9.5,9,8.5,8,7.5]); tierize(tail);
  console.assert(tail.every(p=>p._tier===1), 'tierize: split a bunched tail');
  const tiny = mk([100]); tierize(tiny);
  console.assert(tiny[0]._tier===1, 'tierize: single player');
})();

function weekProj(p, week) {
  // statSplitTypeId is the FOURTH discriminator: weekly entries are split 1, season totals split 0.
  const s = (p.stats||[]).find(s => s.statSourceId===1 && s.scoringPeriodId===week && s.seasonId===2026 && s.statSplitTypeId===1);
  return s ? +s.appliedTotal.toFixed(1) : 0;
}

// Sleeper's dump is ~5MB but we already download it for trending names — keep the useful
// fields too (age, experience, depth-chart slot, injury tag) instead of throwing them away.
// Trimmed to active fantasy positions it's ~0.12MB, smaller than the old name-only cache.
const FPOS = new Set(['QB','RB','WR','TE','K','DEF']);
async function sleeperData() {
  // ponytail: cache key is `sn2` — bumped from `sn` because the row shape changed; a stale
  // `sn` would deserialize as strings and break every field lookup. Bump it again if it changes.
  try { const c = JSON.parse(localStorage.sn2); if (Date.now() - c.t < 864e5) return c.d; } catch {}
  delete localStorage.sn; // drop the old name-only cache so it isn't eating quota
  const all = await fetch('https://api.sleeper.app/v1/players/nfl').then(r=>r.json()).catch(()=>({}));
  const d = {};
  for (const id in all) {
    const p = all[id];
    if (!p.full_name || !FPOS.has(p.position) || p.active === false) continue;
    d[id] = [p.full_name, p.age||0, p.years_exp??'', p.depth_chart_order??'', p.injury_status||'', p.team||''];
  }
  try { localStorage.sn2 = JSON.stringify({t: Date.now(), d}); } catch {}
  return d;
}

async function load() {
  try {
    // 450 matches the research pool (scripts/draft-research.js) so every player Claude
    // analyzed actually renders — at 400 the deepest sleepers were paid for and never shown.
    const filter = encodeURIComponent(JSON.stringify({players:{limit:450, sortDraftRanks:{sortPriority:1, sortAsc:true, value:'PPR'}}}));
    const [league, playerData, trending, analysis, ranks, injuries, news, boom, vnotes] = await Promise.all([
      espn('mTeam,mRoster,mSettings,mMatchup'),
      fetch('/api/espn?view=kona_player_info&filter='+filter).then(r=>r.json()),
      fetch('https://api.sleeper.app/v1/players/nfl/trending/add?limit=50').then(r=>r.json()).catch(()=>[]),
      fetch('/draft-analysis.json').then(r=>r.json()).catch(()=>({})),
      fetch('/analyst-ranks.json').then(r=>r.json()).catch(()=>({players:{}})),
      fetch('/api/nfl?feed=injuries').then(r=>r.json()).catch(()=>({data:{}})),
      fetch('/api/nfl?feed=news').then(r=>r.json()).catch(()=>({data:[]})),
      fetch('/boom-rates.json').then(r=>r.json()).catch(()=>({players:{}})),
      fetch('/video-notes.json').then(r=>r.json()).catch(()=>({notes:{}}))
    ]);
    S.vnotes = vnotes.notes || {};
    S.vnoteTtl = vnotes._ttlWeeks || 3;
    S.boom = boom.players || {};
    S.boomSeason = boom.season || '';
    S.posVar = boom.posVar || {}; // K / D-ST variance, measured from ESPN (league-history.js --kdst-variance)
    S.boomStale = !!boom.stale; // set by boom-rates.js when it fell back to a prior season
    S.injuries = injuries.data || {};
    // headline list per player, newest first (the feed already arrives newest first)
    S.news = {};
    for (const a of news.data || []) for (const n of a.p) (S.news[n] ||= []).push(a);
    S.analysis = analysis.players || {};
    S.ranks = ranks.players || {};
    S.week = league.scoringPeriodId || 1;
    S.schedule = league.schedule || []; // mMatchup — needed to know who he plays this week
    S.teams = league.teams || [];
    const size = S.teams.length || 10;
    REPL = {QB:Math.round(1.2*size), RB:Math.round(2.8*size), WR:Math.round(3.2*size), TE:Math.round(1.2*size), K:size, DST:size};
    $('#league').textContent = (league.settings?.name||'') + ' · Week ' + S.week;
    // FAAB: $1000 continuous-waiver budget, bids process 10am ET. Spend lives on each team.
    S.faabBudget = league.settings?.acquisitionSettings?.acquisitionBudget || 0;
    S.faabMin = league.settings?.acquisitionSettings?.minimumBid ?? 1;
    for (const t of S.teams) S.rosters[t.id] =(t.roster?.entries||[]).map(e => e.playerPoolEntry?.player).filter(Boolean);
    // guess my team via SWID match on owners; fall back to picker
    S.myTeamId = +localStorage.myTeam || S.teams[0]?.id;
    // K/DST excluded from the draft board — he only drafts them with his last 2 picks, no need to clutter the pool
    S.players = (playerData.players||[]).map(x => x.player).filter(p => POS[p.defaultPositionId] && !['K','DST'].includes(POS[p.defaultPositionId]));
    // VBD: projection minus replacement-level projection at position
    const byPos = {};
    for (const p of S.players) (byPos[POS[p.defaultPositionId]] ||= []).push(p);
    for (const pos in byPos) { consensus(byPos[pos], pos); tierize(byPos[pos]); }
    S.players.sort((a,b) => b._vbd - a._vbd);
    // Sleeper dump — trending counts plus age/experience/depth-chart per player, matched by name
    const sd = await sleeperData();
    for (const id in sd) {
      const [name, age, exp, depth, inj, team] = sd[id];
      S.meta[name.toLowerCase()] = { age, exp, depth, inj, team };
    }
    for (const t of trending) { const r = sd[t.player_id]; if (r) S.trending[r[0].toLowerCase()] = t.count; }
    render();
  } catch (e) { $('#view').innerHTML = '<div class="err">Error: '+e+'<br><br>Check .env has LEAGUE_ID, ESPN_S2, SWID — see README.</div>'; }
}

function toggle(set, key, id) { set.has(id) ? set.delete(id) : set.add(id); localStorage[key] = JSON.stringify([...set]); render(); }
window.tDraft = id => toggle(S.drafted, 'd', id);
// Bookmarklet sync: ESPN mock-draft tab posts picks here across origins, since it can't write our localStorage directly.
window.addEventListener('message', e => {
  if (!/^https:\/\/([a-z0-9-]+\.)?espn\.com$/.test(e.origin)) return;
  if (!Array.isArray(e.data)) return;
  let changed = false;
  const missed = [];
  for (const pk of e.data) {
    const name = (pk.player || '').trim();
    if (!name) continue;
    const p = S.players.find(x => (x.fullName||'').toLowerCase() === name.toLowerCase());
    if (p) { if (!S.drafted.has(p.id)) { S.drafted.add(p.id); changed = true; } }
    else missed.push(name);
  }
  if (changed) localStorage.d = JSON.stringify([...S.drafted]);
  // only re-render on real change — the bookmarklet resends the full list every 2s, and

// A player is only worth what he adds to a STARTING lineup. Summing VBD across a roster
// prices a 3rd RB like a starter when this league starts 2 RB + 1 FLEX and he'd sit.
// League lineup slots (verified from settings.rosterSettings.lineupSlotCounts):
// QB1 RB2 WR2 TE1 FLEX1(RB/WR/TE) DST1 K1 + 7 bench. K/DST are 1-for-1 on every roster
// and never traded here, so they're left out of the math entirely.

// for this slot structure — no player is eligible for a position slot he isn't already sorted into.

  for (const p of ps) by[p.pos]?.push(p);

    total += take.reduce((t, p) => t + p.pts, 0); ids.push(...take.map(p => p.id));
    if (FLEXOK.includes(pos)) rest.push(...s.slice(START[pos]));

// A trade engine that scores BOTH sides with one number can almost never find a deal: whatever
// one side gains the other loses, so only lineup-slot luck creates joint value. So price each
// side the way that side actually thinks:
//   HIS  = full consensus (_cval: ESPN + ADP + every analyst board) adjusted for boom/bust risk.
//   THEIRS = _mval — ESPN's projection rank and market ADP only, what a normal manager sees.
// The gap between them IS the trade. He buys where his sources see more than the market does.
//
// Risk adjustment, his side only: this league seeds by RECORD first (points are the tiebreaker)
// and he simulates as the 3rd-strongest roster at ~84% to make the 8-team playoff. A favorite
// does not need ceiling, he needs to not lose games he should win — so variance is a COST.
// A player who busts less than the positional norm is worth a premium to him; a high-boom /
// high-bust player is priced DOWN, which is the engine's way of saying sell him, not buy him.
// A player missing from boom-rates.json casts NO vote (factor 1) — 2026 rookies and players who

  if (!b || typeof b.bust !== 'number' || b.pos !== pos || b.g < MIN_G) return 1;
  if (posBust[pos] === undefined) {

  const dropped = th.filter(p => before.ids.has(p.id) && !after.ids.has(p.id) && !goneIds.has(p.id));
  const added = get.filter(p => after.ids.has(p.id));
  if (!added.length) return 'deepens their bench';
  const rank = p => p.pos + (th.filter(x => x.pos === p.pos && x.pts > p.pts).length + 1);

    ? `${who} ${verb} over ${dropped.map(p => `${p.name} (${rank(p)})`).join(' + ')}`
    : `${who} ${verb} in the hole left by ${give.map(p => p.name).join(' + ')}, at more points`;
}

// ── Weekly win probability ───────────────────────────────────────────────────
// This league seeds RECORD FIRST (points are only the tiebreaker — see CLAUDE.md), so the
// question a start/sit decision actually answers is "does this raise my chance of WINNING
// this week", not "does this raise my projected total". Those two disagree exactly when the
// matchup is lopsided: a big favorite wants the safe floor, an underdog needs the spike.
// Each side's weekly total is modelled Normal(Σ projections, Σ per-player variance).
const cdf = z => { // Φ via A&S 7.1.26 erf approximation — plenty for a probability we round to a %
  const t = 1 / (1 + 0.3275911 * Math.abs(z) / Math.SQRT2);
  const y = 1 - ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t
    * Math.exp(-z * z / 2);

// Volatility as a COEFFICIENT of variation (sd/mean), not raw sd: the ratio carries from last
// season to this week's projection, the absolute number doesn't. A player with no usable
// boom-rates row falls back to his position's median cv — absence must not read as "steady".
const CV_FALLBACK = 0.55; // league-wide-ish; only used if a position has no rated players at all
let _cvMed = null;
function posCv(pos) {

      .map(b => b.sd / b.mean).sort((a, b) => a - b);

  if (KDST.includes(pos)) return (S.posVar || {})[pos]?.cv ?? CV_FALLBACK;

    const row = c => `<tr><td>Start <b>${esc(c.in.name)}</b> (${c.in.pos} ${c.in.pts}) over <b>${esc(c.out.name)}</b> (${c.out.pos} ${c.out.pts})</td>
      <td><span class="chip ${c.dPts >= 0 ? 'good' : 'risk'}">${c.dPts > 0 ? '+' : ''}${c.dPts} pts</span></td>
      <td><span class="chip good">+${pct(c.dWin)} win</span>${c.dPts < 0 ? '<br><span class="meta">costs points, buys win probability</span>' : ''}</td></tr>`;
    return teamPicker() + `<h2>Week ${S.week} vs ${esc(teamName(S.teams.find(t=>t.id===oppId)||{}))}</h2>
    <div style="color:var(--dim);font-size:13px;margin-bottom:8px">Your best lineup projects <b>${me.mu.toFixed(1)}</b>, theirs <b>${opp.mu.toFixed(1)}</b> → <b>${pct(wp)}</b> to win. ${stance}
    <br>This league seeds by record, so the metric that matters is win probability, not total points. Volatility comes from each player's own ${S.boomSeason} week-to-week spread; an unrated player is given his position's average rather than treated as steady. Kicker and defense are included at their measured ${S.boomSeason} positional spread — leaving them out would have treated the two swingiest slots on the roster as certainties and made this number look more confident than it is.</div>
    ${better.length ? `<table><tr><th>Call</th><th>Projection</th><th>Win probability</th></tr>${better.slice(0,8).map(row).join('')}</table>`
      : `<div class="msg">Your points-optimal lineup is also your win-probability-optimal lineup this week. Nothing to change.</div>`}
    ${table}`;
  },
  waivers() {
    const rostered = new Set(Object.values(S.rosters).flat().map(p => p.id));
    const fa = S.players.filter(p => !rostered.has(p.id));
    const hot = fa.filter(p => S.trending[(p.fullName||'').toLowerCase()]);
    return `${teamPicker()}${faabTable()}
    ${hot.length?'<h2>🔥 Trending pickups (Sleeper add-counts, last 24h) still free in YOUR league</h2><table><tr><th>Player</th><th>Pos</th><th>Proj</th><th>VBD</th><th>Bid</th></tr>'+hot.map(p=>row(p,bidCell(p))).join('')+'</table>':''}
    <h2>Best available by rest-of-season value</h2>
    <table><tr><th>Player</th><th>Pos</th><th>Proj</th><th>VBD</th><th>Bid</th></tr>${fa.slice(0,40).map(p=>row(p,bidCell(p))).join('')}</table>`;
  },
  trades() {
    if (!rosterOf(S.myTeamId).length) return teamPicker() + '<div class="msg">No roster yet — this tab comes alive after your draft.</div>';
    const all = findTrades().filter(p => !S.tradeRejects.has(tradeKey(p)));
    // ponytail: top 25 shown; the tail is variations on the same handful of deals.
    const props = all.filter(p => p.themGain > 0).slice(0, 25);
    const names = a => a.map(p => `<b>${esc(p.name)}</b> (${p.pos})`).join(' + ');
    const rows = (ps, cls, rejectable) => ps.map(p => `<tr>
      <td>Send ${names(p.s)} to <b>${esc(teamName(p.t))}</b> for ${names(p.g)}
        <br><span class="meta">${p.themGain > 0 ? 'they gain because ' : 'their side: '}${esc(p.why)}</span>
        ${[...p.s, ...p.g].flatMap(x => [vnoteLine(x.name), newsLine(x.name)]).filter(Boolean).map(l => '<br>'+l).join('')}</td>
      <td><span class="chip good">+${p.meGain} to you</span><br><span class="meta">by consensus + floor</span></td>
      <td><span class="chip ${cls}">${p.themGain > 0 ? '+' : ''}${p.themGain} to them</span><br><span class="meta">by ESPN/ADP</span>
        ${rejectable ? `<br><button class="btn" onclick="rejectTrade('${tradeKey(p)}')">✕ not interested</button>` : ''}</td></tr>`).join('');
    // Nothing mutually positive is a real answer, not a bug — but show the near misses so he can
    // see how far off fair they are, sorted by the smallest loss to the other side.
    const near = all.filter(p => p.themGain <= 0).sort((a,b) => (b.meGain+b.themGain) - (a.meGain+a.themGain)).slice(0, 5);
    const list = props.length ? rows(props, '', true) : `<tr><td colspan="3" class="msg">No trade helps both sides right now — every roster's starters are already where they're worth the most. Closest misses (the other side loses, so expect a no):</td></tr>${rows(near, 'risk', false)}`;
    // Starter value by position: what your lineup would lose if that position vanished.
    const strength = t => { const r = rosterOf(t.id), tot = lineupTotal(r);
      return Object.fromEntries(['QB','RB','WR','TE'].map(pos => [pos, Math.round(tot - lineupTotal(r.filter(p => p.pos !== pos)))])); };
    return teamPicker() + `
    <h2>Trades that help BOTH sides — ranked by your gain (season starter points)</h2>
    <div style="color:var(--dim);font-size:13px;margin-bottom:8px">Value = points a <i>starting lineup</i> gains (QB1 RB2 WR2 TE1 FLEX1), so a 3rd RB is priced at what he'd actually add. <b>Two different valuations:</b> theirs is ESPN's projection + market ADP — what a normal manager sees. Yours is the full consensus (ESPN + ADP + every analyst board) tilted toward floor over ceiling, because this league seeds by record and you're already a favorite: bust weeks cost you games, boom weeks only pad a win. That gap is why both sides can gain on the same trade.</div>
    <div class="tbl-wrap"><table><tr><th>Proposal</th><th>You</th><th>Them</th></tr>${list}</table></div>
    <h2>Starter value by position — what each lineup would lose without it</h2>
    <table><tr><th>Team</th><th>QB</th><th>RB</th><th>WR</th><th>TE</th></tr>${S.teams.map(t => { const s = strength(t);
      return `<tr class="${t.id===S.myTeamId?'mine':''}"><td>${esc(teamName(t))}${t.id===S.myTeamId?' (you)':''}</td><td>${s.QB}</td><td>${s.RB}</td><td>${s.WR}</td><td>${s.TE}</td></tr>`;
    }).join('')}</table>`;
  }
};
window.setSlot = v => { localStorage.slot = v; render(); };
function slotBar() {
  const size = S.teams.length, slot = +localStorage.slot, np = nextPick();
  const opts = Array.from({length:size}, (_,i) => `<option value="${i+1}" ${i+1===slot?'selected':''}>${i+1}</option>`).join('');
  const status = np
    ? (np.away === 0 ? `<b class="onclock">YOU'RE ON THE CLOCK — pick #${np.pick} (round ${np.round})</b>`
       : `Next up: <b>#${np.pick}</b> (round ${np.round}) · <b>${np.away}</b> pick${np.away===1?'':'s'} away · ${S.drafted.size} off the board`)
    : 'Set your draft slot to see when you pick next.';
  const traded = TRADED_ROUNDS.size
    ? `<div style="color:var(--warn);font-size:13px;margin-top:5px">⇄ No round ${[...TRADED_ROUNDS].join(', ')} pick (traded) · you also own a 2nd 10th-rounder at the other manager's slot, pick 44 overall (from the 5th-for-4th swap), and pick 17 overall (from the 2nd-for-2nd swap)</div>`
    : '';
  return `<div class="slotbar">Draft slot <select onchange="setSlot(this.value)"><option value="">—</option>${opts}</select>
    <span style="color:var(--dim)">of ${size}</span> &nbsp; ${status}${traded}</div>`;
}
function teamPicker() {
  return `<select onchange="setTeam(this.value)">${S.teams.map(t=>`<option value="${t.id}" ${t.id===S.myTeamId?'selected':''}>${t.name||t.location+' '+t.nickname}</option>`).join('')}</select> <span style="color:var(--dim);font-size:13px">← pick YOUR team</span><br>`;
}
function render() { $('#view').className=''; $('#view').innerHTML = views[S.tab](); }
function renderBody() { if (S.tab==='draft') $('#tbody').innerHTML = draftRows(); }
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); S.tab=b.dataset.tab; render(); });
load();
// ponytail: full reload every 5 min keeps data live; websockets overkill for daily-changing data
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
