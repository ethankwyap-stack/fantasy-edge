name: Draft research
on: workflow_dispatch
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install @anthropic-ai/sdk --no-fund --no-audit
      - run: node scripts/draft-research.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
      - run: |
          # commit as Ethan's account email — Vercel blocks deploys whose HEAD commit author it can't match
          git config user.name ethankwyap-stack
          git config user.email ethankw.yap@gmail.com
          git add draft-analysis.json
          git diff --cached --quiet && echo "nothing to commit" || (git commit -m "draft research $(date -u +%F)" && git push)
