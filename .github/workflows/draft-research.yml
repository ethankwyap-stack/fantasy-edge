name: Draft research
on: workflow_dispatch
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Claude runs via `claude -p`, billed to the Claude plan through CLAUDE_CODE_OAUTH_TOKEN.
      - run: npm install -g @anthropic-ai/claude-code@2.1.299 --no-fund --no-audit
      - run: node scripts/draft-research.js
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
      - run: |
          # commit as Ethan's account email — Vercel blocks deploys whose HEAD commit author it can't match
          git config user.name ethankwyap-stack
          git config user.email 274671613+ethankwyap-stack@users.noreply.github.com
          git add draft-analysis.json
          git diff --cached --quiet && echo "nothing to commit" || (git commit -m "draft research $(date -u +%F)" && git push)
