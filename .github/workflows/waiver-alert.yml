name: Waiver alert
on:
  schedule:
    # ponytail: hourly 7am-9pm PDT pinned in UTC; drifts to 6am-8pm after Nov PST switch, acceptable
    - cron: '0 14-23,0-4 * * *'
  workflow_dispatch:
jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/cache@v4
        with:
          path: state.json
          key: waiver-state-${{ github.run_id }}
          restore-keys: waiver-state-
      - run: npm install @anthropic-ai/sdk --no-fund --no-audit
      - run: node scripts/waiver-alert.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
