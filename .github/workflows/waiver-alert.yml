name: Waiver alert
on:
  schedule:
    # ponytail: 5x/day (6am, 9am, 12pm, 3pm, 6pm PDT) pinned in UTC; drifts 1h after the Nov PST switch, acceptable.
    # 6am start is deliberate: FAAB bids process at 10am ET (7am PDT), so this is the last run
    # before the deadline that still leaves an hour to act on it.
    - cron: '0 13,16,19,22,1 * * *'
  workflow_dispatch:
jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/cache@v4
        with:
          path: state.json
          key: waiver-state-${{ github.run_id }}
          restore-keys: waiver-state-
      - run: npm install @anthropic-ai/sdk --no-fund --no-audit
      - run: node scripts/waiver-alert.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
